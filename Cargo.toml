[package]
name = "tss"
version = "0.1.0"
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html


[dependencies]
aes-gcm = "0.9.4"
anyhow = "1"
async-trait = "0.1.51"
async-sse = "5.1.0"
dotenv = "0.15.0"
env_logger="0.9.0"
hex = "0.4"
rocket = { version = "0.5.0-rc.1", features = ["json"] }
thiserror = "1.0"
tokio = { version = "1.10" , features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
rand = "0.8"
round-based = { version = "0.1.4", features = [] }
surf = "2.3.2"
serde = "1.0.129"
serde_json = "1.0.66"
serde_derive = "1.0.129"
structopt = { version = "0.3.26", features = ["wrap_help"] }

tracing = "0.1"
tracing-subscriber = "0.2"
futures = "0.3"
uuid = { version = "0.8.2", features = ["v4"] }
lazy_static="1.4.0"
libsecp256k1 = "0.3.2"
curv = { package = "curv-kzen", version = "0.9", default-features = false }
centipede = { version = "0.3", default-features = false }
sha2 = "0.9"
parking_lot = "0.12.1"


diesel = { version = "1.4.8", features = ["postgres", "serde_json", "numeric", "r2d2"] }

[dependencies.multi-party-ecdsa]
git = "https://github.com/KZen-networks/multi-party-ecdsa"

[dependencies.paillier]
version = "0.4.2"
package = "kzen-paillier"
default-features = false

