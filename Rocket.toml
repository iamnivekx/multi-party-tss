[global.limits]
forms = "64 kB"
json = "1 MiB"
msgpack = "2 MiB"
"file/jpg" = "5 MiB"

[debug]
address = "127.0.0.1"
port = 8000
workers = 2
keep_alive = 5
read_timeout = 5
write_timeout = 5
log_level = "normal"

[staging]
address = "0.0.0.0"
port = 8000
workers = 4
keep_alive = 5
read_timeout = 5
write_timeout = 5
log_level = "normal"

[release]
address = "0.0.0.0"
port = 8000
workers = 4
keep_alive = 5
read_timeout = 5
write_timeout = 5
log_level = "critical"